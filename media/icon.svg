<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2431"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <!-- 地图网格（低透明度） -->
  <g stroke="#58a6ff" stroke-opacity="0.08" stroke-width="2">
    <line x1="32" y1="8" x2="32" y2="120"/>
    <line x1="64" y1="8" x2="64" y2="120"/>
    <line x1="96" y1="8" x2="96" y2="120"/>
    <line x1="8" y1="32" x2="120" y2="32"/>
    <line x1="8" y1="64" x2="120" y2="64"/>
    <line x1="8" y1="96" x2="120" y2="96"/>
  </g>
  <!-- 主干线 -->
  <path d="M46,26 V102" stroke="#58a6ff" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- 分支线汇入 -->
  <path d="M86,26 V52 C86,70 46,58 46,76" stroke="#f0883e" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- 节点 -->
  <circle cx="46" cy="34" r="8.5" fill="#58a6ff" stroke="#0d1117" stroke-width="3"/>
  <circle cx="86" cy="34" r="8.5" fill="#f0883e" stroke="#0d1117" stroke-width="3"/>
  <!-- 合并节点（双环） -->
  <circle cx="46" cy="74" r="12" fill="none" stroke="#58a6ff" stroke-width="3.5"/>
  <circle cx="46" cy="74" r="6" fill="#58a6ff"/>
  <!-- 末端节点 -->
  <circle cx="46" cy="98" r="8.5" fill="#3fb950" stroke="#0d1117" stroke-width="3"/>
</svg>
