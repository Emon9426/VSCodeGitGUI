<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>diag-e2e</title>
<style>
  html, body, #app { height: 100%; margin: 0; }
</style>
<script>
  window.__sent = [];
  window.__result = 'pending';
  window.__send = (msg) => window.postMessage(msg, '*');
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => { window.__sent.push(m); },
    getState: () => undefined,
    setState: () => undefined,
  });
</script>
<link rel="stylesheet" href="../../out/webview.css">
</head>
<body>
<div id="app" class="root"></div>
<script src="../../out/webview.js"></script>
<script>
/**
 * AI 诊断与一键修复 e2e（Issue #8）：错误通知「AI 分析」入口 → 诊断模态流式 →
 * 修复方案区分级渲染 → 一键执行（confirm 级 S6 弹窗）→ 失败停止 → 重新诊断闭环
 * （携带最新失败上下文）→ Esc 取消。附：取消/停滞通知不出现 AI 入口。
 */
(async () => {
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const twoFrames = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const fails = [];
  const check = (name, cond) => { if (!cond) fails.push(name); };
  const qs = (s) => document.querySelector(s);
  const qsa = (s) => [...document.querySelectorAll(s)];
  const lastDiagReq = () => [...window.__sent].reverse().find(m => m && m.cmd === 'err.aiDiagnose');
  const lastCancelReq = () => [...window.__sent].reverse().find(m => m && m.cmd === 'err.aiDiagnoseCancel');
  const fixReqByIndex = (i) => [...window.__sent].reverse().find(m => m && m.cmd === 'err.aiFixStep' && m.args && m.args.index === i);

  // ---- RPC 应答器：按 cmd 查 handlers（可变，支持分阶段切换结果）----
  const handlers = {
    'work.aiModels': () => [{ id: 'm1', name: 'Test Model', family: 'test', isDefault: true }],
    'err.aiDiagnose': () => null,
    'err.aiDiagnoseCancel': () => null,
    'err.aiFixStep': () => ({ ok: true }),
    'ui:copy': () => null,
  };
  const handled = new Set();
  (async () => {
    for (;;) {
      for (const m of window.__sent) {
        if (m && typeof m.id === 'number' && !handled.has(m.id)) {
          handled.add(m.id);
          try { window.postMessage({ t: 'res', id: m.id, ok: true, data: handlers[m.cmd] ? handlers[m.cmd](m.args) : null }, '*'); }
          catch { window.postMessage({ t: 'res', id: m.id, ok: false, error: 'mock' }, '*'); }
        }
      }
      await sleep(20);
    }
  })();

  for (let i = 0; i < 100 && !window.__sent.some(m => m && m.t === 'bootstrap'); i++) await sleep(50);
  window.__send({
    t: 'ready',
    config: {
      language: 'zh-CN', dateFormat: 'datetime', rowHeightPx: 24, graphStyle: 'github',
      graphColumnWidth: 180, maxTagChips: 2, showRemoteChips: true, detailPanelPosition: 'bottom',
      commitPageSize: 500, maxAutoLoad: 20000, fetchOnOpen: false, fetchPrune: true,
      defaultPullStrategy: 'merge', logOrder: 'topo', aiEnabled: true, aiLanguage: 'auto',
      aiLearnFromHistory: false, aiUseWorkspaceInstructions: false, commitClearMessage: true,
      commitPushAfter: false, startView: 'graph', aiAutoFix: true,
    },
    repos: [{ id: 'r1', name: 'demo', root: 'D:/demo' }],
    language: 'zh-CN', version: 'e2e',
  });
  await twoFrames();
  window.__send({
    t: 'repoState',
    state: {
      repoId: 'r1',
      head: { sha: 'a' + '0'.repeat(39), branch: 'main', detached: false },
      branches: [{ name: 'main', fullName: 'refs/heads/main', sha: 'a' + '0'.repeat(39), isHead: true,
        upstream: 'origin/main', ahead: 0, behind: 2 }],
      remotes: [{ name: 'origin', branches: [{ name: 'origin/main', fullName: 'refs/remotes/origin/main',
        sha: 'b' + '0'.repeat(39) }] }], tags: [], status: { dirtyCount: 0 },
      filterRef: null, logFilter: { authors: [], since: '', until: '', noMerges: false },
      commits: [], commitsLoaded: 0, hasMore: false, stateVersion: 1,
    },
  });
  // 等 aiModels 应答生效（AI 按钮显隐的数据源）
  for (let i = 0; i < 50 && !window.__sent.some(m => m && m.cmd === 'work.aiModels'); i++) await sleep(40);
  await sleep(200); await twoFrames();

  const notifs = () => qsa('.gg-notif');
  const closeNotifs = async () => { for (const n of notifs()) n.querySelector('.gg-notif-x')?.click(); await twoFrames(); };
  const aiBtn = (n) => [...n.querySelectorAll('button')].find(b => b.textContent === 'AI 分析');
  const retryBtn = (n) => [...n.querySelectorAll('button')].find(b => b.textContent === '重试');

  // ---- 1. 抑制场景：停滞 / 取消 不出现 AI 入口 ----
  window.__send({ t: 'opResult', opId: 1, kind: 'push', ok: false, message: '网络停滞',
    outputTail: 'network stalled: no-output watchdog fired', stalled: true });
  await twoFrames(); await sleep(80);
  check('停滞通知出现', notifs().length === 1);
  check('停滞通知有重试', !!retryBtn(notifs()[0]));
  check('停滞通知无 AI 入口', !aiBtn(notifs()[0]));
  window.__send({ t: 'opResult', opId: 2, kind: 'fetch', ok: false, message: '已取消' });
  await twoFrames(); await sleep(80);
  check('取消通知无 AI 入口', !aiBtn(notifs()[1]));
  await closeNotifs();
  check('通知已清场', notifs().length === 0);

  const shot = new URLSearchParams(location.search).get('shot');
  const freeze = (name) => { document.title = 'diag-e2e:HOLD-' + name; return true; };

  // ---- 2. 可诊断失败：通知按钮 + 上下文请求 ----
  window.__send({ t: 'opResult', opId: 3, kind: 'push', ok: false, message: '推送到 origin 时出错',
    outputTail: 'remote: Invalid username or token.\nfatal: Authentication failed for https://***@github.com/o/r.git/',
    command: 'git push --progress origin main', exitCode: 128 });
  await twoFrames(); await sleep(80);
  const n0 = notifs()[0];
  check('错误通知标题', n0?.querySelector('.gg-notif-title')?.textContent === 'Push失败');
  check('错误通知折叠详情', n0?.querySelector('.gg-notif-detail pre')?.textContent.includes('Authentication failed'));
  check('通知含重试+AI 分析', !!retryBtn(n0) && !!aiBtn(n0));
  if (shot === 'notify') { freeze('notify'); return; }
  const ai = aiBtn(n0);
  if (!ai) {
    window.__result = 'FAIL: AI 分析按钮未渲染（通知=' + (n0 ? n0.textContent.slice(0, 60) : '无') + '）';
    document.title = 'diag-e2e:' + window.__result;
    return;
  }
  ai.click();
  await twoFrames(); await sleep(120);
  const req0 = lastDiagReq();
  check('诊断请求 kind=push', req0?.args?.kind === 'push');
  check('诊断请求带命令与退出码', req0?.args?.command === 'git push --progress origin main' && req0?.args?.exitCode === 128);
  check('诊断请求带上游与落后数', req0?.args?.upstream === 'origin/main' && req0?.args?.behind === 2);
  check('通知点击后关闭', notifs().length === 0);
  const box = qs('.gg-diag');
  check('诊断模态打开', !!box);
  check('模态标题', qs('.gg-modal-title')?.textContent === 'AI 诊断：Push 失败');
  check('副行命令+退出码', qs('.gg-diag-sub')?.textContent.includes('git push --progress origin main')
    && qs('.gg-diag-sub')?.textContent.includes('退出码 128'));
  check('流式态有停止按钮', [...qsa('.gg-diag-foot button')].some(b => b.textContent === '停止'));

  // ---- 3. 流式渲染 → 完成态（修复方案区） ----
  window.__send({ t: 'diagChunk', text: '## 原因\n远端凭证' });
  window.__send({ t: 'diagChunk', text: '被拒绝（401）。' });
  await twoFrames(); await sleep(60);
  check('流式文本渲染', qs('.gg-diag-text')?.textContent.includes('远端凭证被拒绝'));
  if (shot === 'stream') { freeze('stream'); return; }
  window.__send({ t: 'diagDone', model: 'test-model', steps: [
    { index: 1, title: '重新获取远端', cmd: 'git fetch origin', level: 'run',
      action: '从 origin 拉取最新远端引用', consequence: '只更新远端跟踪分支，不动工作区，可随时重跑' },
    { index: 2, title: '重置暂存区', cmd: 'git reset --mixed HEAD', level: 'confirm',
      action: '清空暂存区但保留文件修改', consequence: '已暂存的改动退回未暂存状态；文件内容不变' },
    { index: 3, title: '强制推送', cmd: 'git push --force origin main', level: 'copy',
      action: '覆盖远端历史', consequence: '远端提交将被改写，协作者的仓库会冲突' },
  ] });
  await twoFrames(); await sleep(80);
  check('修复区渲染', !!qs('.gg-fix'));
  check('三步骤行', qsa('.gg-fix-step').length === 3);
  check('徽标三色分级', !!qs('.gg-fix-badge.run') && !!qs('.gg-fix-badge.confirm') && !!qs('.gg-fix-badge.copy'));
  check('需确认计数条', qs('.gg-fix-chip')?.textContent.includes('1'));
  // #37 三要素：作用/后果行渲染 + 后果在 confirm/copy 级醒目 + AI 来源标注
  check('三要素：作用行', qsa('.gg-fix-action').length === 3 && qsa('.gg-fix-action')[0].textContent.includes('拉取最新远端引用'));
  check('三要素：后果行醒目', qsa('.gg-fix-cons.warn').length === 2 && qsa('.gg-fix-cons')[0].textContent.includes('可随时重跑'));
  check('三要素：AI 来源标注', qs('.gg-fix-src')?.textContent.includes('AI 生成'));
  const runAll = [...qsa('.gg-diag-foot button')].find(b => b.textContent.includes('一键执行'));
  check('一键执行（2）', runAll?.textContent === '一键执行（2）');
  if (!runAll) {
    window.__result = 'FAIL: 一键执行按钮未渲染（foot=' + qs('.gg-diag-foot')?.textContent.slice(0, 80) + '）';
    document.title = 'diag-e2e:' + window.__result;
    return;
  }
  check('完成态按钮组', [...qsa('.gg-diag-foot button')].some(b => b.textContent === '复制诊断')
    && [...qsa('.gg-diag-foot button')].some(b => b.textContent === '重试操作'));
  check('模型名入副行', qs('.gg-diag-sub')?.textContent.includes('test-model'));
  if (shot === 'done') { freeze('done'); return; }
  // copy 级行点击只复制不执行
  qsa('.gg-fix-step')[2].querySelector('button')?.click();
  await twoFrames(); await sleep(60);
  const copyReq = [...window.__sent].reverse().find(m => m && m.cmd === 'ui:copy');
  check('copy 级仅复制', copyReq?.args?.text === 'git push --force origin main' && !fixReqByIndex(3));

  // ---- 4. 一键执行 happy path：run 直跑 + confirm 弹 S6 ----
  runAll.click();
  await twoFrames(); await sleep(150);
  check('步骤1 已执行', !!fixReqByIndex(1) && qsa('.gg-fix-step')[0].classList.contains('did-ok'));
  const overlays = qsa('.gg-modal-overlay');
  const confirmBox = overlays[overlays.length - 1];
  check('confirm 级弹确认框', !!confirmBox && confirmBox.textContent.includes('git reset --mixed HEAD'));
  // #37：确认框附 AI 作用/后果说明（人审辅助）
  check('确认框 AI 后果说明', !!confirmBox.querySelector('.gg-dc-ai')
    && confirmBox.textContent.includes('退回未暂存状态')
    && confirmBox.querySelector('.gg-dc-ai-src')?.textContent.includes('AI 生成'));
  const dangerBtn = [...confirmBox.querySelectorAll('button')].find(b => b.classList.contains('danger'));
  check('S6 danger 按钮', dangerBtn?.textContent === '执行此步骤');
  if (shot === 'confirm') { freeze('confirm'); return; }   // 定格确认弹窗，供截图
  dangerBtn.click();
  await twoFrames(); await sleep(150);
  check('步骤2 已执行', !!fixReqByIndex(2) && qsa('.gg-fix-step')[1].classList.contains('did-ok'));
  check('全部完成条', qs('.gg-fix-allok')?.textContent === '全部步骤已执行');
  check('执行中按钮恢复', !runAll.disabled);

  // ---- 5. 失败自动闭环（#37：自动重新诊断，不限轮）----
  handlers['err.aiFixStep'] = () => ({ ok: false });
  runAll.click();
  await twoFrames(); await sleep(150);
  check('失败步标红', qsa('.gg-fix-step')[0].classList.contains('did-fail'));
  check('停止条与原因', qs('.gg-fix-stopped')?.textContent.includes('已停止于第 1 步')
    && qs('.gg-fix-stopped')?.textContent.includes('执行失败'));
  check('自动重新诊断提示', qs('.gg-fix-next')?.textContent.includes('自动重新诊断'));
  if (shot === 'stopped') { freeze('stopped'); return; }
  await sleep(1400);   // 1200ms 延迟窗口后自动开新一轮
  const req1 = lastDiagReq();
  check('自动第二轮请求', req1 !== req0);
  check('第二轮标题', qs('.gg-diag .gg-modal-title')?.textContent.includes('第 2 轮'));
  check('单实例模态', qsa('.gg-diag').length === 1);
  check('新会话流式态', [...qsa('.gg-diag-foot button')].some(b => b.textContent === '停止'));

  // ---- 5b. autoFix 自动发起诊断（#37：错误即诊断，无需点「AI 分析」）----
  const stopBtn = [...qsa('.gg-diag-foot button')].find(b => b.textContent === '停止');
  stopBtn?.click();
  await twoFrames(); await sleep(80);
  check('模态已关闭', !qs('.gg-diag'));
  window.__send({ t: 'opResult', opId: 4, kind: 'fetch', ok: false, message: '获取失败',
    outputTail: 'fatal: unable to access', command: 'git fetch origin', exitCode: 128 });
  await twoFrames(); await sleep(120);
  const req2 = lastDiagReq();
  check('autoFix 自动诊断请求', req2 !== req1 && req2?.args?.kind === 'fetch' && req2?.args?.exitCode === 128);
  check('autoFix 诊断模态自动打开', !!qs('.gg-diag'));

  // ---- 6. Esc 取消流式 ----
  window.__send({ t: 'diagChunk', text: '分析中' });
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
  await twoFrames(); await sleep(120);
  check('Esc 发送取消请求', !!lastCancelReq());
  check('Esc 后模态关闭', !qs('.gg-diag'));

  window.__result = fails.length ? 'FAIL: ' + fails.join(' | ') : 'PASS';
  document.title = 'diag-e2e:' + window.__result;
})();
</script>
</body>
</html>
