<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="920" height="330" fill="#0d1117"/>
  <text x="16" y="34" fill="#e6edf3" font-size="14" font-weight="600">筛选：分支 × 作者 × 时间段，可任意叠加</text>

  <!-- 工具栏筛选条放大 -->
  <g>
    <rect x="16" y="52" width="888" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
    <rect x="28" y="60" width="90" height="24" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="36" y="77" fill="#c9d1d9" font-size="11.5">main ▾</text>
    <text x="132" y="77" fill="#8b949e" font-size="10.5">分支过滤下拉（或点击左侧分支树）</text>
    <rect x="330" y="60" width="100" height="24" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="338" y="77" fill="#c9d1d9" font-size="11.5">Emon</text>
    <text x="444" y="77" fill="#8b949e" font-size="10.5">作者（支持 git 正则）</text>
    <rect x="596" y="60" width="104" height="24" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="602" y="77" fill="#c9d1d9" font-size="10.5" font-family="Consolas, monospace">2026-08-01</text>
    <text x="706" y="77" fill="#8b949e" font-size="11">–</text>
    <rect x="714" y="60" width="104" height="24" rx="4" fill="#0d1117" stroke="#30363d"/>
    <text x="720" y="77" fill="#c9d1d9" font-size="10.5" font-family="Consolas, monospace">2026-08-19</text>
    <rect x="826" y="60" width="20" height="24" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="836" y="77" fill="#c9d1d9" font-size="12" text-anchor="middle">×</text>
    <text x="852" y="77" fill="#8b949e" font-size="10.5">清除</text>
  </g>

  <!-- 筛选结果 -->
  <g>
    <text x="16" y="124" fill="#8b949e" font-size="11">筛选结果（时间列格式 YYYY-MM-DD HH:mm:ss，可在设置中改为相对时间）：</text>
    <rect x="16" y="134" width="888" height="24" fill="#161b22"/>
    <g fill="#8b949e" font-size="10.5">
      <text x="28" y="150">图形</text><text x="200" y="150">提交说明</text><text x="640" y="150">作者</text><text x="730" y="150">SHA</text><text x="896" y="150" text-anchor="end">时间</text>
    </g>
    <g>
      <rect x="16" y="158" width="888" height="24" fill="#093568"/>
      <path d="M38,158 V254" stroke="#58a6ff" stroke-width="2" fill="none"/>
      <circle cx="38" cy="170" r="4" fill="#58a6ff"/>
      <circle cx="38" cy="194" r="4" fill="#58a6ff"/>
      <circle cx="38" cy="218" r="4" fill="#58a6ff"/>
      <circle cx="38" cy="242" r="4" fill="#58a6ff"/>
      <g font-size="11" fill="#e6edf3">
        <text x="200" y="174">修复：虚拟滚动边界行重复渲染</text>
        <text x="200" y="198">重构 lane 分配算法为增量计算</text>
        <text x="200" y="222">perf: 大仓库分页加载与 LRU 缓存</text>
        <text x="200" y="246">chore: 初始化项目脚手架</text>
      </g>
      <g fill="#8b949e" font-size="10.5">
        <text x="640" y="174">Emon</text><text x="640" y="198">Emon</text><text x="640" y="222">Emon</text><text x="640" y="246">Emon</text>
      </g>
      <g fill="#8b949e" font-size="10.5" font-family="Consolas, monospace">
        <text x="730" y="174">a3f8e21</text><text x="730" y="198">b7c92d4</text><text x="730" y="222">e02c91a</text><text x="730" y="246">1a0b3c9</text>
        <text x="896" y="174" text-anchor="end">2026-08-19 20:15:32</text>
        <text x="896" y="198" text-anchor="end">2026-08-18 14:02:10</text>
        <text x="896" y="222" text-anchor="end">2026-08-12 09:55:21</text>
        <text x="896" y="246" text-anchor="end">2026-08-10 10:02:57</text>
      </g>
    </g>
    <text x="16" y="286" fill="#8b949e" font-size="10.5">· 作者输入 450ms 防抖自动应用；截止日期按当天 23:59:59 含全天</text>
    <text x="16" y="304" fill="#8b949e" font-size="10.5">· 筛选条件按仓库记忆，切换仓库后各自保留；条件透传 git log --author / --since / --until</text>
  </g>
</svg>
