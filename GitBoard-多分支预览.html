<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>GitBoard 多分支渲染预览</title>
<style>
/* ============ VS Code Dark+ 主题变量（离线模拟） ============ */
:root {
  --vscode-font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  --vscode-editor-font-family: Consolas, "Courier New", monospace;
  --vscode-foreground: #cccccc;
  --vscode-descriptionForeground: #9d9d9d;
  --vscode-editor-background: #1e1e1e;
  --vscode-sideBar-background: #181818;
  --vscode-editorWidget-background: #252526;
  --vscode-panel-border: #333333;
  --vscode-focusBorder: #0078d4;
  --vscode-list-hoverBackground: #2a2d2e;
  --vscode-list-activeSelectionBackground: #04395e;
  --vscode-list-activeSelectionForeground: #ffffff;
  --vscode-list-inactiveSelectionBackground: #37373d;
  --vscode-charts-blue: #4fc1ff;
  --vscode-charts-orange: #f0883e;
  --vscode-charts-green: #3fb950;
  --vscode-charts-purple: #a371f7;
  --vscode-charts-yellow: #d29922;
  --vscode-charts-red: #f85149;
  --vscode-button-secondaryBackground: #3a3d41;
  --vscode-button-secondaryForeground: #ffffff;
  --vscode-diffEditor-insertedTextBackground: rgba(63,185,80,0.14);
  --vscode-diffEditor-removedTextBackground: rgba(248,81,73,0.14);
  --vscode-textCodeBlock-background: rgba(128,128,128,0.08);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  font-family: var(--vscode-font-family); font-size: 13px;
  color: var(--vscode-foreground); background: var(--vscode-editor-background);
}
#app.root { position: fixed; inset: 0; display: flex; flex-direction: column; }
button {
  font-family: inherit; font-size: 12px; cursor: pointer;
  color: var(--vscode-button-secondaryForeground);
  background: var(--vscode-button-secondaryBackground);
  border: 1px solid transparent; border-radius: 4px; padding: 3px 10px;
}
button:hover { background: #45494e; }
.hidden { display: none !important; }

/* ---------------- 工具栏 ---------------- */
.gg-toolbar {
  flex: none; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px;
  border-bottom: 1px solid var(--vscode-panel-border);
  background: var(--vscode-editorWidget-background);
}
.gg-toolbar-left, .gg-toolbar-right { display: flex; align-items: center; gap: 8px; }
.gg-toolbar-right { margin-left: auto; }
.gg-branch-label { color: var(--vscode-charts-green); white-space: nowrap; }
.gg-dirty-badge { margin-left: 6px; color: var(--vscode-charts-yellow); font-size: 11px; }
.gg-tb-btn { min-width: 34px; font-size: 14px; line-height: 1; padding: 4px 8px; }
.gg-icon-btn { min-width: 24px; padding: 2px 6px; }
.gg-version-label { font-size: 10.5px; color: var(--vscode-descriptionForeground); opacity: 0.7; }

/* ---------------- 整体 ---------------- */
.gg-body { flex: 1; display: flex; min-height: 0; }
.gg-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* ---------------- 侧栏 ---------------- */
.gg-side {
  width: 220px; min-width: 220px; overflow-y: auto;
  border-right: 1px solid var(--vscode-panel-border);
  background: var(--vscode-sideBar-background); padding-bottom: 20px;
}
.gg-side-h {
  padding: 10px 12px 4px; font-size: 11px; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--vscode-descriptionForeground);
}
.gg-side-item {
  display: flex; align-items: center; gap: 6px; padding: 3px 12px;
  cursor: pointer; white-space: nowrap; overflow: hidden;
}
.gg-side-item:hover { background: var(--vscode-list-hoverBackground); }
.gg-side-item.active { background: var(--vscode-list-activeSelectionBackground); color: var(--vscode-list-activeSelectionForeground); }
.gg-side-item.branch.head .gg-side-name { font-weight: 600; }
.gg-side-item.branch { padding-left: 14px; }
.gg-side-item.remote { padding-left: 26px; }
.gg-side-item.tag { padding-left: 14px; }
.gg-side-name { overflow: hidden; text-overflow: ellipsis; }
.gg-side-sub { font-size: 11px; color: var(--vscode-descriptionForeground); margin-left: auto; }
.gg-dot { width: 7px; height: 7px; min-width: 7px; border-radius: 50%; background: var(--vscode-charts-green); }
.gg-ab { margin-left: auto; font-size: 11px; color: var(--vscode-descriptionForeground); }
.gg-ab b { font-weight: 400; }
.gg-ab b.a { color: var(--vscode-charts-green); }
.gg-ab b.d { color: var(--vscode-charts-red); }

/* ---------------- 提交列表 ---------------- */
.gg-list-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.gg-list-header, .gg-row {
  display: grid;
  grid-template-columns: var(--c-graph, 150px) var(--c-msg, 460px) var(--c-author, 120px) var(--c-sha, 90px) minmax(150px, 1fr);
}
.gg-list-header {
  flex: none; height: 28px; line-height: 28px;
  border-bottom: 1px solid var(--vscode-panel-border);
  background: var(--vscode-editorWidget-background);
}
.gg-col-h { padding: 0 8px; font-size: 11.5px; color: var(--vscode-descriptionForeground); overflow: hidden; }
.gg-list-body { flex: 1; position: relative; min-height: 0; }
.gg-list { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; outline: none; }
.gg-list-sizer { position: relative; width: 100%; }
.gg-row { position: absolute; top: 0; left: 0; right: 0; align-items: center; cursor: default; }
.gg-row:hover { background: var(--vscode-list-hoverBackground); }
.gg-row.selected {
  background: var(--vscode-list-activeSelectionBackground);
  color: var(--vscode-list-activeSelectionForeground);
  box-shadow: inset 3px 0 0 var(--vscode-focusBorder);
}
.gg-cell { padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.gg-cell.msg { display: flex; align-items: center; gap: 6px; }
.gg-subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.gg-cell.sha, .gg-cell.time { font-family: var(--vscode-editor-font-family); font-size: 12px; color: var(--vscode-descriptionForeground); }
.gg-row.selected .gg-cell.sha, .gg-row.selected .gg-cell.time, .gg-row.selected .gg-cell.author { color: inherit; }
.gg-cell.time { text-align: right; }
.gg-cell.author { color: var(--vscode-descriptionForeground); }
.gg-chip {
  flex: none; display: inline-flex; align-items: center; height: 17px; padding: 0 7px;
  border-radius: 9px; font-size: 11px; line-height: 1; max-width: 160px;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border: 1px solid transparent;
}
.gg-chip.head { color: var(--vscode-charts-green); background: color-mix(in srgb, var(--vscode-charts-green) 18%, transparent); }
.gg-chip.remote { color: var(--vscode-charts-purple); background: color-mix(in srgb, var(--vscode-charts-purple) 18%, transparent); }
.gg-chip.tag { color: var(--vscode-charts-yellow); background: color-mix(in srgb, var(--vscode-charts-yellow) 18%, transparent); }
.gg-graph-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }

/* ---------------- 详情面板 ---------------- */
.gg-detail {
  flex: none; height: 240px; display: flex; flex-direction: column;
  border-top: 1px solid var(--vscode-panel-border);
  background: var(--vscode-editor-background); min-height: 0;
}
.gg-detail-head {
  flex: none; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px;
  background: var(--vscode-editorWidget-background);
}
.gg-detail-sha { font-family: var(--vscode-editor-font-family); font-size: 12px; color: var(--vscode-charts-blue); }
.gg-detail-body { flex: 1; display: flex; min-height: 0; }
.gg-detail-left {
  width: 46%; min-width: 320px; overflow-y: auto;
  border-right: 1px solid var(--vscode-panel-border); padding: 8px 10px;
}
.gg-detail-right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.gg-summary { display: flex; flex-direction: column; gap: 2px; }
.gg-sum-row { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
.gg-sum-label { flex: none; width: 72px; color: var(--vscode-descriptionForeground); }
.gg-sum-value { font-family: var(--vscode-editor-font-family); word-break: break-all; }
.gg-mini-btn { flex: none; margin-left: auto; padding: 0 6px; font-size: 11px; }
.gg-message {
  margin-top: 6px; padding: 6px 8px;
  border-left: 3px solid var(--vscode-charts-blue);
  background: var(--vscode-textCodeBlock-background);
  white-space: pre-wrap; word-break: break-word; font-size: 12px; max-height: 72px; overflow-y: auto;
}
.gg-files-head { margin-top: 8px; font-size: 11.5px; color: var(--vscode-descriptionForeground); padding: 2px 0; }
.gg-files { display: flex; flex-direction: column; }
.gg-file {
  display: flex; align-items: center; gap: 8px; padding: 2px 4px;
  font-family: var(--vscode-editor-font-family); font-size: 12px; cursor: pointer; white-space: nowrap;
}
.gg-file:hover { background: var(--vscode-list-hoverBackground); }
.gg-file.selected { background: var(--vscode-list-activeSelectionBackground); color: var(--vscode-list-activeSelectionForeground); }
.gg-st { flex: none; width: 14px; font-weight: 700; text-align: center; }
.gg-st.M, .gg-st.T { color: var(--vscode-charts-yellow); }
.gg-st.A, .gg-st.C { color: var(--vscode-charts-green); }
.gg-st.D { color: var(--vscode-charts-red); }
.gg-st.R { color: var(--vscode-charts-blue); }
/* 数字列对齐：增/删各占一列，右对齐 + 表格数字 */
.gg-num {
  flex: none; display: flex; justify-content: flex-end; gap: 6px;
  font-size: 11px; font-variant-numeric: tabular-nums;
  color: var(--vscode-descriptionForeground);
}
.gg-num b { flex: none; min-width: 40px; text-align: right; font-weight: 400; }
.gg-num b.a { color: var(--vscode-charts-green); }
.gg-num b.d { color: var(--vscode-charts-red); }
.gg-file-path { overflow: hidden; text-overflow: ellipsis; }
.gg-diff-head {
  flex: none; display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px;
  background: var(--vscode-editorWidget-background);
}
.gg-diff-path {
  font-family: var(--vscode-editor-font-family); font-size: 12px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.gg-diff-head .gg-btn { margin-left: auto; flex: none; }
.gg-btn.small { padding: 2px 8px; font-size: 11.5px; }
.gg-diff-box { flex: 1; overflow: auto; font-family: var(--vscode-editor-font-family); font-size: 12px; line-height: 1.5; padding-bottom: 12px; }
.gg-dl { display: flex; white-space: pre; }
.gg-dl .gg-ln { flex: none; width: 44px; text-align: right; padding-right: 8px; color: var(--vscode-descriptionForeground); opacity: 0.7; }
.gg-dl .gg-mark { flex: none; width: 14px; }
.gg-dl.hunk { background: var(--vscode-editorWidget-background); color: var(--vscode-descriptionForeground); padding: 2px 0; }
.gg-dl.gap { justify-content: center; color: var(--vscode-descriptionForeground); opacity: 0.75; background: rgba(128,128,128,0.06); font-size: 11px; padding: 1px 0; }
.gg-dl.add { background: var(--vscode-diffEditor-insertedTextBackground); }
.gg-dl.add .gg-mark { color: var(--vscode-charts-green); }
.gg-dl.del { background: var(--vscode-diffEditor-removedTextBackground); }
.gg-dl.del .gg-mark { color: var(--vscode-charts-red); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(121,121,121,0.4); border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app" class="root">
  <div class="gg-toolbar">
    <div class="gg-toolbar-left">

    </div>
    <div class="gg-toolbar-right">
      <span class="gg-version-label">GitBoard 0.6.0 · 多分支渲染预览</span>
    </div>
  </div>
  <div class="gg-body">
    <div class="gg-side">
      <div class="gg-side-h">分支</div>
      <div class="gg-side-item branch head"><span class="gg-dot"></span><span class="gg-side-name">main</span><span class="gg-ab"><b class="a">↑2</b> <b class="d">↓1</b></span></div>
      <div class="gg-side-item branch"><span class="gg-dot"></span><span class="gg-side-name">feature/diff-rewrite</span></div>
      <div class="gg-side-item remote"><span class="gg-side-name">origin/main</span></div>
      <div class="gg-side-item remote"><span class="gg-side-name">origin/feature/diff-rewrite</span></div>
      <div class="gg-side-h">标签</div>
      <div class="gg-side-item tag"><span class="gg-side-name">v1.2.0</span></div>
      <div class="gg-side-item tag"><span class="gg-side-name">v1.1.0</span></div>
    </div>
    <div class="gg-main">
      <div class="gg-list-wrap">
        <div class="gg-list-header">
          <span class="gg-col-h">图形</span><span class="gg-col-h">说明</span><span class="gg-col-h">作者</span><span class="gg-col-h">SHA</span><span class="gg-col-h">时间（作者）</span>
        </div>
        <div class="gg-list-body">
          <div class="gg-list" id="list"><div class="gg-list-sizer" id="sizer"></div></div>
          <canvas class="gg-graph-canvas" id="canvas"></canvas>
        </div>
      </div>
      <div class="gg-detail" id="detail">
        <div class="gg-detail-head"><span class="gg-detail-sha" id="d-sha"></span></div>
        <div class="gg-detail-body">
          <div class="gg-detail-left">
            <div class="gg-summary" id="d-summary"></div>
            <div class="gg-message" id="d-msg"></div>
            <div class="gg-files-head" id="d-files-head"></div>
            <div class="gg-files" id="d-files"></div>
          </div>
          <div class="gg-detail-right">
            <div class="gg-diff-head">
              <span class="gg-diff-path" id="d-diff-path"></span>
              <button class="gg-btn small">📂</button><button class="gg-btn small">完整上下文</button><button class="gg-btn small">在差异编辑器中打开</button>
            </div>
            <div class="gg-diff-box" id="d-diff"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ================= Mock 数据：多分支（主干 + 2 条已合并支线 + 1 条未合并远程支线） ================= */
const C = (sha, shortSha, parents, subject, author, date, refs) =>
  ({ sha, shortSha, parents, subject, author, date, refs, body: '' });

const commits = [
  C('9af3e2ad41c8', '9af3e2a', ['m2sha'], 'chore: 发布 v1.2.0', 'Emon', '2026-08-20T10:12:00+08:00', [
    { name: 'HEAD → main', kind: 'head', isHead: true }, { name: 'origin/main', kind: 'remote' }, { name: 'v1.2.0', kind: 'tag' },
  ]),
  C('m2sha', '3d7c91b', ['i8sha', 'h2sha'], "Merge branch 'hotfix/render'", 'Emon', '2026-08-19T18:40:00+08:00', []),
  C('i8sha', 'b42e6f0', ['m1sha'], 'docs: 更新 README 多仓库说明', 'Emon', '2026-08-19T16:05:00+08:00', []),
  C('w2sha', 'e91a07d', ['w1sha'], 'refactor: diff 渲染改为分段构建', 'Lin Wei', '2026-08-19T14:22:00+08:00', [
    { name: 'origin/feature/diff-rewrite', kind: 'remote' },
  ]),
  C('w1sha', '5c8f2e3', ['m1sha'], 'wip: diff 模块骨架', 'Lin Wei', '2026-08-18T09:30:00+08:00', []),
  C('m1sha', '77d1b4a', ['g7sha', 'd3sha'], "Merge branch 'feature/density'", 'Emon', '2026-08-18T08:55:00+08:00', []),
  C('h2sha', '0f3c9d2', ['h1sha'], 'fix: 空仓库打开时的空指针', 'Zhang San', '2026-08-17T21:10:00+08:00', []),
  C('h1sha', 'c5e8a31', ['g7sha'], 'fix: 高 DPI 下画布模糊', 'Zhang San', '2026-08-17T20:48:00+08:00', []),
  C('d3sha', 'a2b64f9', ['d2sha'], 'feat: 密度档位持久化记忆', 'Emon', '2026-08-16T15:37:00+08:00', []),
  C('d2sha', '8d91e47', ['d1sha'], 'feat: 紧凑/舒适双档切换', 'Emon', '2026-08-16T11:02:00+08:00', []),
  C('d1sha', 'f40c7b2', ['d0sha'], 'feat: 行高密度可调', 'Emon', '2026-08-15T19:44:00+08:00', []),
  C('g7sha', '6b3a5c1', ['f6sha'], 'chore: 发布 v1.1.0', 'Emon', '2026-08-14T10:00:00+08:00', [
    { name: 'v1.1.0', kind: 'tag' },
  ]),
  C('f6sha', '2e9d084', ['e5sha'], 'fix: 快速滚动时行错位', 'Emon', '2026-08-13T17:26:00+08:00', []),
  C('e5sha', '71f0c3d', ['d0sha'], 'feat: 详情面板（概要 + 文件 + 内联 diff）', 'Emon', '2026-08-12T14:08:00+08:00', []),
  C('d0sha', '48c2b6e', ['c4sha'], 'feat: Canvas 线条层与短半径圆角', 'Emon', '2026-08-11T09:51:00+08:00', []),
  C('c4sha', '9a3e7f5', ['b3sha'], 'feat: 虚拟滚动列表', 'Lin Wei', '2026-08-10T16:19:00+08:00', []),
  C('b3sha', 'd57c1a8', ['a2sha'], 'feat: 提交图渲染', 'Lin Wei', '2026-08-09T10:35:00+08:00', []),
  C('a2sha', '1b8f04e', [], 'init: 项目脚手架', 'Emon', '2026-08-08T08:00:00+08:00', []),
];

/* ================= Lane 分配（与 src/graph/lanes.ts 相同算法，按分支段着色） ================= */
function computeLanes(commits) {
  const lanes = [], laneSeg = [], activeBelow = [], curves = [];
  let segCount = 0;
  for (let i = 0; i < commits.length; i++) {
    const c = commits[i];
    const hit = [];
    for (let k = 0; k < lanes.length; k++) if (lanes[k] === c.sha) hit.push(k);
    let lane;
    if (hit.length > 0) {
      lane = hit[0];
      for (const h of hit) if (h !== lane) {
        curves.push({ row: i, fromLane: h, toLane: lane, kind: 'mergeIn', seg: laneSeg[h] ?? 0 });
        lanes[h] = null; laneSeg[h] = null;
      }
    } else {
      lane = lanes.indexOf(null);
      if (lane === -1) { lane = lanes.length; lanes.push(null); laneSeg.push(null); }
      laneSeg[lane] = segCount++;   // 分支尖/首提交：新分支段
    }
    c.lane = lane;
    c.seg = laneSeg[lane] ?? 0;
    if (c.parents.length === 0) { lanes[lane] = null; laneSeg[lane] = null; }
    else {
      lanes[lane] = c.parents[0];
      laneSeg[lane] = c.seg;        // 第一父线延续本段
      for (let p = 1; p < c.parents.length; p++) {
        const parent = c.parents[p], existing = lanes.indexOf(parent);
        if (existing !== -1) {
          if (existing !== lane) curves.push({ row: i, fromLane: lane, toLane: existing, kind: 'mergeOut', seg: laneSeg[existing] ?? 0 });
        } else {
          let k = lanes.indexOf(null);
          if (k === -1) { k = lanes.length; lanes.push(null); laneSeg.push(null); }
          lanes[k] = parent;
          laneSeg[k] = segCount++;  // 第二父是新支线：新分支段
          curves.push({ row: i, fromLane: lane, toLane: k, kind: 'fork', seg: segCount - 1 });
        }
      }
    }
    const act = [];
    for (let k = 0; k < lanes.length; k++) if (lanes[k] !== null) act.push({ lane: k, seg: laneSeg[k] ?? 0 });
    activeBelow.push(act);
  }
  let laneCount = 0;
  for (const c of commits) laneCount = Math.max(laneCount, (c.lane ?? 0) + 1);
  for (const act of activeBelow) for (const k of act) laneCount = Math.max(laneCount, k.lane + 1);
  return { laneCount, activeBelow, curves, segCount };
}

/* ================= Canvas 绘制（与 src/ui/app/graphCanvas.ts 相同走线） ================= */
const PADDING = 8, LANE_W = 11;
const COLORS = ['#4fc1ff', '#f0883e', '#3fb950', '#a371f7', '#d29922', '#f85149'];
const R = 24; // 行高
let angular = false;

function redraw(graph) {
  const canvas = document.getElementById('canvas');
  const list = document.getElementById('list');
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(150, PADDING * 2 + graph.laneCount * LANE_W);
  const h = list.clientHeight;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  document.querySelector('.gg-list-wrap').style.setProperty('--c-graph', w + 'px');

  const scrollTop = list.scrollTop, n = commits.length;
  const yc = row => row * R + R / 2 - scrollTop;
  const x = lane => PADDING + lane * LANE_W;
  const segColor = seg => COLORS[((seg % COLORS.length) + COLORS.length) % COLORS.length];

  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // 竖线（fork/mergeOut 目标 lane 由 S 曲线整段接管；下一行 mergeIn 的 lane 提前半行收尾）
  const curvesByRow = new Map();
  for (const c of graph.curves) (curvesByRow.get(c.row) ?? curvesByRow.set(c.row, []).get(c.row)).push(c);
  for (let r = 0; r <= n - 1; r++) {
    const yTop = yc(r), yBottom = r === n - 1 ? yTop + R : yc(r + 1);
    const takenHere = new Set();
    for (const cv of curvesByRow.get(r) ?? []) if (cv.kind !== 'mergeIn') takenHere.add(cv.toLane);
    const stopEarly = new Map();
    for (const cv of curvesByRow.get(r + 1) ?? []) if (cv.kind === 'mergeIn') stopEarly.set(cv.fromLane, yBottom - R / 2);
    for (const a of graph.activeBelow[r] ?? []) {
      if (takenHere.has(a.lane)) continue;
      const yStop = Math.min(yBottom, stopEarly.get(a.lane) ?? yBottom);
      if (yStop - yTop < 0.5) continue;
      ctx.strokeStyle = segColor(a.seg);
      ctx.beginPath(); ctx.moveTo(x(a.lane), yTop); ctx.lineTo(x(a.lane), yStop); ctx.stroke();
    }
  }
  // 曲线：fork/mergeOut 整行 S 曲线；mergeIn 肘形曲线汇入提交点
  for (const [r, cvs] of curvesByRow) {
    const y0 = yc(r);
    for (const cv of cvs) {
      const x1 = x(cv.fromLane), x2 = x(cv.toLane);
      if (cv.kind === 'mergeIn') {
        ctx.strokeStyle = segColor(cv.seg);
        ctx.beginPath(); ctx.moveTo(x1, y0 - R / 2);
        if (angular) ctx.lineTo(x2, y0);
        else ctx.bezierCurveTo(x1, y0, (x1 + x2) / 2, y0, x2, y0);
        ctx.stroke();
      } else {
        ctx.strokeStyle = segColor(cv.seg);
        const y1 = y0 + R;
        ctx.beginPath(); ctx.moveTo(x1, y0);
        if (angular) { ctx.lineTo(x2, y0 + R / 2); ctx.lineTo(x2, y1); }
        else if (x1 === x2) ctx.lineTo(x2, y1);
        else ctx.bezierCurveTo(x1, y0 + R / 2, x2, y0 + R / 2, x2, y1);
        ctx.stroke();
      }
    }
  }
  // 节点
  const bg = '#1e1e1e';
  for (let r = 0; r < n; r++) {
    const c = commits[r], y0 = yc(r);
    const cx = x(c.lane ?? 0);
    const isHead = c.refs.some(ref => ref.isHead);
    const isMerge = c.parents.length > 1;
    const radius = 3.8, color = segColor(c.seg ?? c.lane ?? 0);
    if (isMerge) {
      ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, y0, radius + 2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.fillStyle = color;
    ctx.strokeStyle = isHead ? '#f85149' : bg;
    ctx.lineWidth = isHead ? 2 : 1.5;
    ctx.beginPath(); ctx.arc(cx, y0, isHead ? radius + 0.5 : radius, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
}

/* ================= 列表 DOM ================= */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function fmtTime(iso) {
  const d = new Date(iso), now = new Date('2026-08-20T12:00:00+08:00');
  const days = (now - d) / 86400000;
  const pad = n => String(n).padStart(2, '0');
  if (days < 1) return '今天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (days < 2) return '昨天';
  if (days < 7) return Math.floor(days) + ' 天前';
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function buildChips(c) {
  return c.refs.map(ref => el('span', 'gg-chip ' + ref.kind, ref.name));
}

const graph = computeLanes(commits);

  const row = el('div', 'gg-row');
  row.style.height = R + 'px';
  row.style.transform = `translateY(${i * R}px)`;
  row.append(el('span', 'gg-cell graph'), (() => {
    const m = el('span', 'gg-cell msg', c.subject);
    m.classList.add('gg-cell'); m.textContent = '';
    m.appendChild(el('span', 'gg-subject', c.subject));
    for (const chip of buildChips(c)) m.appendChild(chip);
    return m;
  })(), (() => {
    const a = el('span', 'gg-cell author', c.author); a.title = c.author.toLowerCase() + '@example.com'; return a;
  })(), el('span', 'gg-cell sha', c.shortSha), (() => {
    const t = el('span', 'gg-cell time', fmtTime(c.date)); t.title = c.date.replace('T', ' ').slice(0, 16); return t;
  })());
  row.addEventListener('click', () => selectCommit(i));
  sizer.appendChild(row);
  rows.push(row);
});
sizer.style.height = commits.length * R + 'px';

function base(p) { return p.slice(p.lastIndexOf('/') + 1); }

function fileRow(f, i) {
  const row = el('div', 'gg-file');
  row.appendChild(el('span', 'gg-st ' + f.status, f.status));
  const num = el('span', 'gg-num');
  if (f.additions !== undefined) {
    num.appendChild(el('b', 'a', '+' + f.additions));
    num.appendChild(el('b', 'd', '−' + (f.deletions ?? 0)));
  }
  row.appendChild(num);
  const label = f.oldPath ? `${base(f.oldPath)} → ${base(f.path)}` : base(f.path);
  const pathEl = el('span', 'gg-file-path', label);
  pathEl.title = f.oldPath ? `${f.oldPath} → ${f.path}` : f.path; // 悬停查看完整路径
  row.appendChild(pathEl);
  row.addEventListener('click', () => {
    document.querySelectorAll('.gg-file').forEach(r => r.classList.remove('selected'));
    row.classList.add('selected');
    document.getElementById('d-diff-path').textContent = f.path;
  });
  if (i === 0) row.classList.add('selected');
  return row;
}
